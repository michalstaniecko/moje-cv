# Konfiguracja pakowania aplikacji (electron-builder). Budowanie: `pnpm dist:mac`.
# Cele Windows/Linux można dopisać obok `mac` – reszta konfiguracji jest wspólna.
appId: com.michalstaniecko.mojecv
artifactName: CV-Drawer-${version}.${ext}
directories:
  output: dist
# Do aplikacji trafia tylko zbudowany kod z `out/` (plus zależności produkcyjne dołączane automatycznie).
files:
  - out/**/*
  - package.json
# Fonty osadzane w DOCX export (niezmienione TTF od upstreamu z `OFL.txt` i `SOURCES.md`) poza archiwum asar:
# `Contents/Resources/fonts`, skąd czyta je src/main/docx/docxFonts.ts (ADR-0008).
extraResources:
  - from: resources/fonts
    to: fonts
# Bez auto-update. Powiadomienie o nowej wersji (bez pobierania): ADR-0006.
publish: null
mac:
  category: public.app-category.productivity
  # Podpis ad-hoc („-”), nie Developer ID: bez niego macOS na Apple Silicon uznaje pobraną aplikację za „uszkodzoną”
  # i nie pozwala jej otworzyć. Z nim działa zwykłe „Otwórz mimo to” (patrz docs/instalacja.md).
  identity: '-'
  # Hardened runtime potrzebny jest tylko do notaryzacji; przy podpisie ad-hoc blokowałby ładowanie frameworków Electrona.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: universal
dmg:
  title: CV Drawer ${version}
  # Plik .blockmap służy tylko do auto-update.
  writeUpdateInfo: false
