<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="alternate" hreflang="{% if page.lang == 'pl' %}en{% else %}pl{% endif %}" href="{{ page.translation | absolute_url }}">
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        max-width: 44rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
      header .app { font-weight: 600; }
      header nav a { margin-left: 1rem; }
      h1 { font-size: 1.9rem; line-height: 1.25; }
      h2 { margin-top: 2rem; }
      code { font-size: 0.9em; overflow-wrap: anywhere; }
      a { color: #2563eb; }
      @media (prefers-color-scheme: dark) { a { color: #7aa7ff; } }
      footer { margin-top: 3rem; font-size: 0.9rem; opacity: 0.75; }
    </style>
  </head>
  <body>
    <header>
      <span class="app">CV Drawer</span>
      <nav>
        {% if page.lang == 'pl' %}
        <a href="{{ '/pl/' | relative_url }}">Pomoc</a>
        <a href="{{ '/pl/privacy/' | relative_url }}">Polityka prywatności</a>
        <a href="{{ page.translation | relative_url }}" hreflang="en" lang="en">English</a>
        {% else %}
        <a href="{{ '/' | relative_url }}">Help</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ page.translation | relative_url }}" hreflang="pl" lang="pl">Polski</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>© 2026 Michal Staniecko</footer>
  </body>
</html>
